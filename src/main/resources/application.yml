server:
  port: 8080

spring:
  application:
    name: be
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase?TimeZone=UTC
    username: myuser
    password: secret
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-local-dev-only-secret-key-please-change-me}
    access-token-ttl-seconds: 900
  refresh-token:
    ttl-days: 30
  invitation:
    link-base-url: ${INVITE_LINK_BASE_URL:https://financetracker.app/invite}
